name: Autotag

on:
  push:
    branches:
      - "master"

jobs:
  tag-release:
    # smolfiddle fork: autotag needs GH_PAT, only present upstream
    if: ${{ github.repository == 'FlareSolverr/FlareSolverr' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Auto tag
        uses: Klemensas/action-autotag@stable
        with:
          GITHUB_TOKEN: "${{ secrets.GH_PAT }}"
          tag_prefix: "v"
